<!doctype html>
<!--
  The repository's preview card (slice 0016), 1280×640, screenshotted by
  e2e/capture.spec.ts into docs/images/social-card.png after review.png is
  captured. Colours and type are the page's own light tokens (src/web/styles.css).
  Upload the PNG in the repository's Settings → General → Social preview.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Trial Prescreening</title>
    <style>
      /* Chart v2's light tokens and fonts (slice 0020), from src/web/styles.css. */
      @font-face { font-family: "IBM Plex Sans"; src: url("../../src/web/fonts/IBMPlexSans-Regular.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "IBM Plex Sans"; src: url("../../src/web/fonts/IBMPlexSans-SemiBold.woff2") format("woff2"); font-weight: 600; }
      @font-face { font-family: "IBM Plex Mono"; src: url("../../src/web/fonts/IBMPlexMono-Medium.woff2") format("woff2"); font-weight: 500; }
      :root {
        --bg: #f6f7f8;
        --surface: #ffffff;
        --line: #d9dee3;
        --ink: #14202b;
        --ink-2: #4a5866;
        --mark-lead: #7fb6de;
        --mark-line: #ffffff;
        --shadow-overlay: 0 8px 24px rgba(20, 32, 43, 0.14);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 640px;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        display: grid;
        grid-template-columns: 540px 1fr;
        gap: 48px;
        height: 100%;
        padding: 72px 0 0 72px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 24px;
        font-weight: 600;
      }
      .brand svg {
        width: 34px;
        height: 34px;
      }
      .tile {
        fill: var(--ink);
      }
      .lead {
        fill: var(--mark-lead);
      }
      .line {
        fill: var(--mark-line);
      }
      h1 {
        margin: 36px 0 20px;
        font-weight: 600;
        font-size: 46px;
        line-height: 54px;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        font-size: 22px;
        line-height: 32px;
        color: var(--ink-2);
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 40px;
      }
      .tags span {
        padding: 4px 10px;
        border: 1px solid var(--line);
        border-radius: 2px;
        font: 500 16px/22px "IBM Plex Mono", ui-monospace, monospace;
        color: var(--ink-2);
      }
      .shot {
        align-self: start;
        height: 600px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-right: 0;
        border-radius: 6px 0 0 6px;
        background: var(--surface);
        box-shadow: var(--shadow-overlay);
      }
      .shot img {
        display: block;
        width: 1000px;
        /* Past the review's summary column (212 px at this scale), to its main column. */
        margin: -56px 0 0 -226px;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <div class="brand">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <rect class="tile" width="100" height="100" rx="22" />
            <rect class="lead" x="20" y="23.5" width="60" height="11" rx="5.5" />
            <rect class="line" x="20" y="44.5" width="46" height="11" rx="5.5" />
            <rect class="line" x="20" y="65.5" width="32" height="11" rx="5.5" />
          </svg>
          Trial Prescreening
        </div>
        <h1>An AI runs a trial's first eligibility conversation.</h1>
        <p>
          A coordinator reviews what the person said, rule by rule, and makes the decision.
        </p>
        <div class="tags">
          <span>Local model</span>
          <span>Made-up patients</span>
          <span>Measured by evals</span>
        </div>
      </div>
      <div class="shot">
        <img src="../../docs/images/review.png" alt="The coordinator review" />
      </div>
    </main>
  </body>
</html>
